name: recyclescan
description: "Scan everyday items and instantly learn how to dispose of them responsibly."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Scanner
  camera: ^0.10.5+9
  google_generative_ai: ^0.4.0

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Animations
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # UI Components
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0

  # Utilities
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  google_mlkit_image_labeling: ^0.16.1
  google_mlkit_barcode_scanning: ^0.16.1
  confetti: ^0.8.0
  home_widget: ^0.9.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/data/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"
